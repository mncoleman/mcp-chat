<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="MCP Chat">
  <!-- Solid tile rather than a bare glyph: the tab strip is light in one theme and
       dark in the other, and a filled ground keeps the mark legible in both. -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <path d="M9 6h14a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-6l-6 5v-5H9a4 4 0 0 1-4-4v-8a4 4 0 0 1 4-4z" fill="#ffffff"/>
  <!-- Punched out of the bubble, not drawn over it, so the silhouette still reads
       as a speech bubble when the dots collapse at 16px. -->
  <circle cx="11" cy="14" r="1.6" fill="#0f172a"/>
  <circle cx="16" cy="14" r="1.6" fill="#0f172a"/>
  <circle cx="21" cy="14" r="1.6" fill="#0f172a"/>
</svg>
